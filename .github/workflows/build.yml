name: Build Folio IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build device IPA without Apple credentials
        run: bash build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-IPA
          path: build/Folio-unsigned.ipa
          retention-days: 3
          if-no-files-found: error
  native-tests:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test native dialogs, paper viewer, breaks and layout
        run: bash test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Folio-UI-tests
          path: |
            build/Folio-UI-tests.xcresult
            build/ui-test-attachments
          retention-days: 3
